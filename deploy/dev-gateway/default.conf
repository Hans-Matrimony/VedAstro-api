server {
    listen 80;
    server_name _;
    server_tokens off;
    # Calculation paths can contain birth details. Do not record request URLs.
    access_log off;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy","mode":"hosted-proxy","upstream":"api.vedastro.org"}';
    }
    location /api/Calculate/ {
        limit_except GET POST { deny all; }
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $calculator_host api.vedastro.org;
        proxy_pass https://$calculator_host$request_uri;
        proxy_set_header Host $calculator_host;
        proxy_ssl_server_name on;
        proxy_ssl_name $calculator_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Set-Cookie;
    }
    location / { return 404; }
}
